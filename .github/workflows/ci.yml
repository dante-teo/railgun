name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build locked release backend
        run: cargo build --locked --release --package railgun-backend

      - name: Check migrations, fixtures, and legal policy
        run: |
          cargo xtask migration check
          cargo xtask fixtures
          cargo xtask legal --check

      - name: Check dependency licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@v2

  native:
    name: Railgun (arm64)
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install pinned XcodeGen
        uses: ./.github/actions/install-xcodegen

      - name: Generate, resolve, build, test, and validate Railgun
        run: apps/macos/scripts/validate-project.sh
