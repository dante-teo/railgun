name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-railgun:
    name: Electron (arm64)
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read desktop tool versions
        id: desktop-toolchain
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version="$(jq -r '.packageManager | split("@")[1]' apps/desktop/package.json)"
          node_version="$(jq -r '.devEngines.runtime.version | ltrimstr("^")' apps/desktop/package.json)"
          [[ "$pnpm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$node_version" =~ ^24\.[0-9]+\.[0-9]+$ ]]
          echo "pnpm=$pnpm_version" >> "$GITHUB_OUTPUT"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"

      - name: Verify arm64 runner
        run: test "$(uname -m)" = arm64

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.desktop-toolchain.outputs.pnpm }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.desktop-toolchain.outputs.node }}
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Install pinned Sparkle tools
        uses: ./.github/actions/install-sparkle-tools

      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            printf 'Tag %s does not match package version %s.\n' "$GITHUB_REF_NAME" "$package_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read previous release build number
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(gh release view --json tagName --jq .tagName)"
          previous="$RUNNER_TEMP/previous-release"
          mkdir -p "$previous"
          gh release download "$previous_tag" \
            --pattern 'Railgun-*-darwin-arm64.zip' \
            --dir "$previous"
          archive="$(find "$previous" -maxdepth 1 -name '*.zip' -print -quit)"
          /usr/bin/ditto -x -k "$archive" "$previous/unpacked"
          previous_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$previous/unpacked/Railgun.app/Contents/Info.plist")"
          [[ "$previous_build" =~ ^[0-9]+$ ]]
          echo "build=$previous_build" >> "$GITHUB_OUTPUT"
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Build locked arm64 Rust backend
        run: cargo build --locked --release --package railgun-backend

      - name: Build, sign, notarize, and staple Electron application
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          GH_TOKEN: ${{ github.token }}
          RAILGUNX_SPARKLE_PUBLIC_EDDSA_KEY: ${{ secrets.RAILGUNX_SPARKLE_PUBLIC_EDDSA_KEY }}
        run: |
          set -euo pipefail
          apps/desktop/scripts/release/validate-build-number.sh \
            --candidate "$GITHUB_RUN_NUMBER" \
            --previous '${{ steps.previous.outputs.build }}' \
            --previous-tag '${{ steps.previous.outputs.tag }}' \
            --current-tag "$GITHUB_REF_NAME"
          pnpm --dir apps/desktop build
          pnpm --dir apps/desktop exec electron-builder \
            --mac --arm64 --publish never \
            --config.buildVersion="$GITHUB_RUN_NUMBER"

      - name: Generate signed native-to-Electron appcast
        env:
          RAILGUNX_SPARKLE_PRIVATE_EDDSA_KEY: ${{ secrets.RAILGUNX_SPARKLE_PRIVATE_EDDSA_KEY }}
          RAILGUNX_SPARKLE_PUBLIC_EDDSA_KEY: ${{ secrets.RAILGUNX_SPARKLE_PUBLIC_EDDSA_KEY }}
        run: |
          apps/desktop/scripts/release/generate-appcast.sh \
            --archive "apps/desktop/dist/Railgun-${{ steps.metadata.outputs.version }}-darwin-arm64.zip" \
            --output apps/desktop/dist/Railgun-appcast-arm64.xml \
            --download-url-prefix "https://github.com/dante-teo/railgun/releases/download/${GITHUB_REF_NAME}/"

      - name: Smoke-check packaged Railgun
        env:
          RAILGUNX_SPARKLE_PRIVATE_EDDSA_KEY: ${{ secrets.RAILGUNX_SPARKLE_PRIVATE_EDDSA_KEY }}
          RAILGUNX_SPARKLE_PUBLIC_EDDSA_KEY: ${{ secrets.RAILGUNX_SPARKLE_PUBLIC_EDDSA_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(find apps/desktop/dist -maxdepth 1 -name '*-mac.yml' -print -quit)"
          test -n "$metadata"
          apps/desktop/scripts/release/validate-release-artifact.sh \
            --app apps/desktop/dist/mac-arm64/Railgun.app \
            --archive "apps/desktop/dist/Railgun-${{ steps.metadata.outputs.version }}-darwin-arm64.zip" \
            --dmg "apps/desktop/dist/Railgun-${{ steps.metadata.outputs.version }}-darwin-arm64.dmg" \
            --metadata "$metadata" \
            --architecture arm64 \
            --appcast apps/desktop/dist/Railgun-appcast-arm64.xml \
            --version "${{ steps.metadata.outputs.version }}" \
            --build "$GITHUB_RUN_NUMBER"

      - name: Upload Electron release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: railgun-electron-arm64
          path: |
            apps/desktop/dist/Railgun-*.dmg
            apps/desktop/dist/Railgun-*.dmg.blockmap
            apps/desktop/dist/Railgun-*.zip
            apps/desktop/dist/Railgun-*.zip.blockmap
            apps/desktop/dist/*-mac.yml
            apps/desktop/dist/Railgun-appcast-arm64.xml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Railgun
    needs: build-railgun
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Electron artifacts
        uses: actions/download-artifact@v8
        with:
          name: railgun-electron-arm64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            args=("$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
            gh release create "${args[@]}"
          fi
