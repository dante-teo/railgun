name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-railgun:
    name: Railgun (arm64)
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build locked arm64 Rust backend
        run: cargo build --locked --release --package railgun-backend

      - name: Install pinned XcodeGen
        uses: ./.github/actions/install-xcodegen

      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        id: keychain
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/railgun-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate="$RUNNER_TEMP/railgun-release.p12"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application: Chen Pei Teo (GUKP6SNV36)'
          echo "path=$keychain" >> "$GITHUB_OUTPUT"

      - name: Archive, sign, notarize, and staple Railgun
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RAILGUNX_SPARKLE_PUBLIC_EDDSA_KEY: ${{ secrets.RAILGUNX_SPARKLE_PUBLIC_EDDSA_KEY }}
        run: |
          apps/macos/scripts/archive-release.sh \
            --architecture arm64 \
            --version "${{ steps.metadata.outputs.version }}" \
            --build "$GITHUB_RUN_NUMBER" \
            --identity 'Developer ID Application: Chen Pei Teo (GUKP6SNV36)' \
            --keychain "${{ steps.keychain.outputs.path }}" \
            --output "$RUNNER_TEMP/railgun" \
            --source-packages-output "$RUNNER_TEMP/railgun-source-packages"

      - name: Generate signed Sparkle appcast
        env:
          RAILGUNX_SPARKLE_PRIVATE_EDDSA_KEY: ${{ secrets.RAILGUNX_SPARKLE_PRIVATE_EDDSA_KEY }}
        run: |
          apps/macos/scripts/generate-appcast.sh \
            --archive "$RUNNER_TEMP/railgun/Railgun-${{ steps.metadata.outputs.version }}-darwin-arm64.zip" \
            --output "$RUNNER_TEMP/railgun/Railgun-appcast-arm64.xml" \
            --download-url-prefix "https://github.com/dante-teo/railgun/releases/download/${GITHUB_REF_NAME}/" \
            --source-packages "$RUNNER_TEMP/railgun-source-packages"

      - name: Smoke-check packaged Railgun
        run: |
          apps/macos/scripts/validate-release-artifact.sh \
            --app "$RUNNER_TEMP/railgun/Railgun.app" \
            --archive "$RUNNER_TEMP/railgun/Railgun-${{ steps.metadata.outputs.version }}-darwin-arm64.zip" \
            --architecture arm64 \
            --appcast "$RUNNER_TEMP/railgun/Railgun-appcast-arm64.xml"

      - name: Upload Railgun artifacts
        uses: actions/upload-artifact@v7
        with:
          name: railgun-native-arm64
          path: |
            ${{ runner.temp }}/railgun/Railgun-*.zip
            ${{ runner.temp }}/railgun/Railgun-appcast-*.xml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Railgun
    needs: build-railgun
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Railgun artifacts
        uses: actions/download-artifact@v8
        with:
          name: railgun-native-arm64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            args=("$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
            gh release create "${args[@]}"
          fi
