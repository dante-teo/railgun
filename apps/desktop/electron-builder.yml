appId: io.anvia.railgun
productName: Railgun
forceCodeSigning: true
afterPack: scripts/inject-sparkle-key.mjs
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: ../../target/release/railgun-backend
    to: backend/railgun-backend
  - from: ../../legal/LegalNoticeManifest.json
    to: legal/LegalNoticeManifest.json
  - from: ../../legal/ThirdPartyNotices.md
    to: legal/ThirdPartyNotices.md
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
  - from: resources/app-update.yml
    to: app-update.yml
mac:
  artifactName: Railgun-${version}-darwin-${arch}.${ext}
  binaries:
    - Contents/Resources/backend/railgun-backend
  category: public.app-category.developer-tools
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  minimumSystemVersion: '15.0'
  notarize: true
  target:
    - dmg
    - zip
npmRebuild: false
publish:
  provider: github
  owner: dante-teo
  repo: railgun
